<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de paletas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <h1>Generador de Paletas</h1>
    <p>Genera combinaciones de colores aleatorias usando HSL y HEX.</p>
      <nav>
        <ul class="navegacion">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="#contacto">Contactos</a></li>
        </ul>
      </nav>
  </header>

  <main class="contenedor">
        <div class="controles">

            <select class="colores" id="selector">
                <option value="6">6 colores</option>
                <option value="8">8 colores</option>
                <option value="9">9 colores</option>
            </select>

            <button class="boton" id="button">Generar paleta</button>
            <button class="boton boton-secundario" id="descargar">Descargar PNG</button>

        </div>

        <section class="paleta" id="paleta" aria-label="Paleta de colores">
            <!-- Los colores se generan con JavaScript -->
        </section>

        <section class="informacion">
            <h2>Colores de la paleta</h2>

            <div class="lista-colores" id="listaColores">
                <!-- Información generada con JavaScript -->
            </div>
        </section>

    </main>

    <div class="aviso" id="aviso">¡Copiado!</div>


  <footer class="footer" id="contacto">
    <p>@Copyright 2026</p>
    <ul class="links">
      <li>Email:<a class="link-contacto" href="mailto:verdunjuank@gmail.com" target="_blank">verdunjuank@gmail.com</a></li>
      <li>Github:<a class="link-contacto" href="https://github.com/verdun-juank/ProyectoM1_VerdunJuan.git " target="_blank">Repositorio</a></li>
    </ul>
  </footer>
    
  <script src="app.js"></script>
</body>
</html>
